plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	// 入力検証（@Valid / @NotBlank など）を使うために追加
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Spring Boot 4 はオートコンフィグがモジュール分割されたため、
	// Flyway は flyway-core 単体ではなく専用スターターが必要
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// 依存ライブラリを含まない "-plain.jar" は使わないので作らない。
// （デプロイで送る JAR を、実行可能な bootJar の 1 つだけにする）
tasks.named('jar') {
	enabled = false
}

// 実行可能 JAR のファイル名をバージョンに関係なく app.jar に固定する。
// デプロイスクリプト（scripts/deploy.ps1）はこのファイルだけを送るので、
// build/libs に古いバージョンの JAR が残っていても、誤って送ることがない。
tasks.named('bootJar') {
	archiveFileName = 'app.jar'
}
