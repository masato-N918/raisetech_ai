spring.application.name=taskboard

# 接続情報は .env から読み込む（Spring Boot 4 は .env をネイティブには読まないため
# config.import で明示的にプロパティソースとして取り込む。[.properties] は拡張子なしファイルの形式ヒント）
spring.config.import=optional:file:.env[.properties]

# PostgreSQL データソース（値は .env 由来）
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
